
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLZ7 - Contatore Giorni Senza Incidenti</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', 'Calibri', 'Arial', sans-serif;
            overflow: hidden;
        }

        .slide {
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 3vh 5vw;
        }

        /* === HEADER — Logo Amazon Logistics === */
        .slide-header {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding-top: 1vh;
        }

        .logo-amazon img {
            height: 8vh;
            max-height: 80px;
            object-fit: contain;
        }

        /* === CORPO CENTRALE === */
        .slide-body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex: 1;
            gap: 1.5vh;
        }

        .incident-line1 {
            font-size: 4.5vh;
            font-weight: 700;
            color: #1E9BC4;
            text-align: center;
            line-height: 1.3;
        }

        .incident-line2 {
            font-size: 4.5vh;
            font-weight: 700;
            font-style: italic;
            color: #1E9BC4;
            text-align: center;
            margin-top: -0.5vh;
        }

        .counter-label {
            font-size: 3.5vh;
            font-weight: 700;
            color: #232F3E;
            text-align: center;
            margin-top: 1vh;
            letter-spacing: 2px;
        }

        .counter-number {
            font-size: 22vh;
            font-weight: 900;
            color: #232F3E;
            line-height: 1;
            letter-spacing: -4px;
        }

        /* === FOOTER — Logo DLZ7 === */
        .slide-footer {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding-bottom: 1vh;
        }

        .logo-dlz7 img {
            height: 12vh;
            max-height: 120px;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="slide">

        <!-- HEADER: Logo Amazon Logistics centrato in alto -->
        <div class="slide-header">
            <div class="logo-amazon">
                <img src="amazon_logistics.png" alt="Amazon Logistics">
            </div>
        </div>

        <!-- CORPO: Testo + Contatore -->
        <div class="slide-body">
            <div class="incident-line1">Giorni trascorsi da ultimo</div>
            <div class="incident-line2">Recordable Incident</div>
            <div class="counter-label">Contatore</div>
            <div class="counter-number" id="dayCount">0</div>
        </div>

        <!-- FOOTER: Logo DLZ7 centrato in basso -->
        <div class="slide-footer">
            <div class="logo-dlz7">
                <img src="dlz7.png" alt="DS DLZ7">
            </div>
        </div>

    </div>

    <script>
        // ========== CONFIGURAZIONE ==========
        var START_YEAR = 2026;
        var START_MONTH = 3;  // Marzo = 3
        var START_DAY = 6;
        // =====================================

        function calculateDays() {
            var startDate = new Date(START_YEAR, START_MONTH - 1, START_DAY);
            startDate.setHours(0, 0, 0, 0);

            var now = new Date();
            now.setHours(0, 0, 0, 0);

            var diffTime = now.getTime() - startDate.getTime();
            var diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

            document.getElementById('dayCount').textContent = diffDays;
        }

        calculateDays();
        setInterval(calculateDays, 60000);
    </script>
</body>
</html>
